verticalCandidatesCell:
  type: verticalCandidates
  candidateStyle: candidateCellStyle
  maxRows: 5
  maxColumns: 7
  separatorColor: "#FFFFFF24"
  insets:
    top: 4
    left: 4
    bottom: 4
    right: 4
verticalLastRowStyle:
  size:
    height: 48
verticalPageUpButton:
  action:
    shortcut: "#verticalCandidatesPageUp"
