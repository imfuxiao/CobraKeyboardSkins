    top: 6
    left: 6
    bottom: 6
    right: 6
verticalCandidatesLayout:
- HStack:
    subviews:
    - Cell: verticalCandidatesCell
- HStack:
    style: verticalLastRowStyle
    subviews:
    - Cell: verticalPageUpButton
    - Cell: verticalPageDownButton
    - Cell: verticalReturnButton
