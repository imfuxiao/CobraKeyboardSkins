colNarrow:
  size:
    width: "17/100"
colWide:
  size:
    width: "22/100"
keyboardLayout:
- VStack:
    style: colNarrow
    subviews:
    - Cell: numericSymbolList
    - Cell: symbolicButton
- VStack:
    style: colWide
    subviews:
    - Cell: oneButton
    - Cell: fourButton
    - Cell: sevenButton
    - Cell: returnLastKeyboardButton
- VStack:
    style: colWide
    subviews:
    - Cell: twoButton
    - Cell: fiveButton
    - Cell: eightButton
    - Cell: zeroButton
- VStack:
    style: colWide
    subviews:
    - Cell: threeButton
    - Cell: sixButton
    - Cell: nineButton
    - Cell: spaceButton
- VStack:
    style: colNarrow
    subviews:
    - Cell: backspaceButton
    - Cell: periodButton
    - Cell: equalButton
    - Cell: enterButton
numericSymbolList:
  type: numericSymbols
  backgroundStyle: spaceKeyBackground
  separatorLineColor: "#3B4D6B24"
  insets:
    top: 6
    left: 4
    bottom: 4
    right: 4
symbolicButton:
  size:
    height: "1/4"
  action:
    keyboardType: symbolic
  animation:
  - keyPressScale
  backgroundStyle: functionalKeyBackground
  foregroundStyle: symbolicButtonLabel
symbolicButtonLabel:
  buttonStyleType: text
  text: "#+="
  fontSize: 15.5
  fontWeight: medium
  normalColor: "#2B3F5E"
  highlightColor: "#142238"
oneButton:
  action:
    character: '1'
  swipeUpAction:
    character: "!"
  animation:
  - keyPressScale
  backgroundStyle: letterKeyBackground
  foregroundStyle:
  - oneLabel
  - oneBadge
oneLabel:
  buttonStyleType: text
  text: '1'
  fontSize: 24
  fontWeight: regular
  center:
