enterButtonAccentLabel:
  buttonStyleType: text
  text: "$returnKeyType"
  fontSize: 15.5
  fontWeight: semibold
  normalColor: "#FFFFFF"
  highlightColor: "#FFFFFF"
enterReturnKeyTypeNotification:
  notificationType: returnKeyType
  returnKeyType:
  - 1
  - 4
  - 7
  - 9
  - 10
  backgroundStyle: enterAccentKeyBackground
  foregroundStyle: enterButtonAccentLabel
