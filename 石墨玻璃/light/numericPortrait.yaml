# 石墨玻璃 — 浅色模式（冰晶石墨玻璃） — numericPortrait
preeditHeight: 25
toolbarHeight: 40
keyboardHeight: 216
transparentBackgroundStyle:
  buttonStyleType: geometry
  normalColor: "#E8EEF601"
  highlightColor: "#E8EEF601"
verticalCandidatesBackgroundStyle:
  buttonStyleType: geometry
  cornerRadius: 12
  normalColor: &id001
  - "#F3F7FCFA"
  - "#E6EEF8FC"
  highlightColor: *id001
  colorLocation:
  - 0
  - 1
  colorStartPoint:
    x: 0.5
    "y": 0
  colorEndPoint:
    x: 0.5
    "y": 1
  colorGradientType: axial
  borderSize: 0.5
  normalBorderColor: "#FFFFFFD6"
  highlightBorderColor: "#FFFFFFD6"
preeditStyle:
  backgroundStyle: transparentBackgroundStyle
  foregroundStyle: preeditForegroundStyle
  insets:
    top: 2
    left: 8
    bottom: 1
    right: 8
preeditForegroundStyle:
  buttonStyleType: text
  fontSize: 15
  fontWeight: medium
  textColor: "#2364A6"
toolbarStyle:
  backgroundStyle: transparentBackgroundStyle
  insets:
    left: 4
    right: 4
toolbarLayout:
- HStack:
    subviews:
    - Cell: toolbarMenuButton
    - Cell: toolbarSpacer
    - Cell: toolbarDismissButton
toolbarMenuButton:
  size:
    width: 44
  action:
    shortcut: "#keyboardMenu"
  foregroundStyle: toolbarMenuButtonIcon
toolbarMenuButtonIcon:
  buttonStyleType: systemImage
  systemImageName: command
  fontSize: 17
  fontWeight: regular
  normalColor: "#334866D9"
  highlightColor: "#2364A6"
toolbarSpacer: {}
toolbarDismissButton:
  size:
    width: 44
  action: dismissKeyboard
  foregroundStyle: toolbarDismissButtonIcon
toolbarDismissButtonIcon:
  buttonStyleType: systemImage
  systemImageName: keyboard.chevron.compact.down
  fontSize: 18
  fontWeight: regular
  normalColor: "#334866D9"
  highlightColor: "#2364A6"
horizontalCandidatesStyle:
  backgroundStyle: transparentBackgroundStyle
  insets:
    top: 3
    left: 6
    bottom: 2
    right: 4
horizontalCandidatesLayout:
- HStack:
    subviews:
    - Cell: horizontalCandidatesCell
    - Cell: candidatesExpandButton
horizontalCandidatesCell:
  type: horizontalCandidates
  candidateStyle: candidateCellStyle
  maxColumns: 7
candidatesExpandButton:
  size:
    width: 44
  action:
    shortcut: "#candidatesBarStateToggle"
  foregroundStyle: candidatesExpandButtonIcon
candidatesExpandButtonIcon:
  buttonStyleType: systemImage
  systemImageName: chevron.down
  fontSize: 15
  fontWeight: medium
  normalColor: "#334866D9"
  highlightColor: "#2364A6"
verticalCandidatesStyle:
  backgroundStyle: verticalCandidatesBackgroundStyle
  insets:
    top: 6
    left: 6
    bottom: 6
    right: 6
verticalCandidatesLayout:
- HStack:
    subviews:
    - Cell: verticalCandidatesCell
- HStack:
    style: verticalLastRowStyle
    subviews:
    - Cell: verticalPageUpButton
    - Cell: verticalPageDownButton
    - Cell: verticalReturnButton
    - Cell: verticalBackspaceButton
verticalCandidatesCell:
  type: verticalCandidates
  candidateStyle: candidateCellStyle
  maxRows: 5
  maxColumns: 6
  separatorColor: "#3B4D6B24"
  insets:
    top: 4
    left: 4
    bottom: 4
    right: 4
verticalLastRowStyle:
  size:
    height: 45
verticalPageUpButton:
  action:
    shortcut: "#verticalCandidatesPageUp"
  animation:
  - keyPressScale
  backgroundStyle: functionalKeyBackground
  foregroundStyle: verticalPageUpIcon
verticalPageUpIcon:
  buttonStyleType: systemImage
  systemImageName: chevron.up
  fontSize: 18
  normalColor: "#2B3F5E"
  highlightColor: "#142238"
verticalPageDownButton:
  action:
    shortcut: "#verticalCandidatesPageDown"
  animation:
  - keyPressScale
  backgroundStyle: functionalKeyBackground
  foregroundStyle: verticalPageDownIcon
verticalPageDownIcon:
  buttonStyleType: systemImage
  systemImageName: chevron.down
  fontSize: 18
  normalColor: "#2B3F5E"
  highlightColor: "#142238"
verticalReturnButton:
  action:
    shortcut: "#candidatesBarStateToggle"
  animation:
  - keyPressScale
  backgroundStyle: functionalKeyBackground
  foregroundStyle: verticalReturnIcon
verticalReturnIcon:
  buttonStyleType: systemImage
  systemImageName: return
  fontSize: 18
  normalColor: "#2B3F5E"
  highlightColor: "#142238"
verticalBackspaceButton:
  action: backspace
  repeatAction: backspace
  animation:
  - keyPressScale
  backgroundStyle: functionalKeyBackground
  foregroundStyle: verticalBackspaceIcon
verticalBackspaceIcon:
  buttonStyleType: systemImage
  systemImageName: delete.left
  highlightSystemImageName: delete.left.fill
  fontSize: 18
  normalColor: "#2B3F5E"
  highlightColor: "#142238"
candidateCellStyle:
  insets:
    top: 3
    left: 8
    bottom: 3
    right: 8
  backgroundCornerRadius: 8
  textFontSize: 17
  commentFontSize: 12
  indexFontSize: 11
  textColor: "#1B2536"
  commentColor: "#5E728FC4"
  indexColor: "#6C809EB0"
  preferredBackgroundColor: "#3A8CD426"
  preferredTextColor: "#185691"
  preferredCommentColor: "#2A6AA6CC"
  preferredIndexColor: "#2A6AA6B8"
  highlightBackgroundColor: "#3A8CD43A"
candidateContextMenu:
- name: 复制
  action:
    shortcut: "#copy"
keyboardStyle:
  backgroundStyle: transparentBackgroundStyle
keyPressScale:
  animationType: scale
  scale: 0.94
  pressDuration: 45
  releaseDuration: 95
  isAutoReverse: false
