enterButton:
  action: enter
  swipeUpAction:
    symbol: "\r\n"
  animation:
  - keyPressScale
  backgroundStyle:
  - conditionKey: "$returnKeyType"
    conditionValue:
    - 0
    - 2
    - 3
    - 5
    - 6
    - 8
    - 11
    styleName: enterKeyBackground
  - conditionKey: "$returnKeyType"
    conditionValue:
    - 1
    - 4
    - 7
    - 9
    - 10
    styleName: enterAccentKeyBackground
  foregroundStyle:
  - conditionKey: "$returnKeyType"
    conditionValue:
    - 0
    - 2
    - 3
    - 5
    - 6
    - 8
    - 11
    styleName: enterButtonLabel
  - conditionKey: "$returnKeyType"
    conditionValue:
    - 1
    - 4
    - 7
    - 9
    - 10
    styleName: enterButtonAccentLabel
  notification:
