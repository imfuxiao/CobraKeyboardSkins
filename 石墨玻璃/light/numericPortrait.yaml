  normalBorderColor: "#FFFFFFF2"
  highlightBorderColor: "#5CAEEB9E"
  normalShadowColor: "#283B5826"
  highlightShadowColor: "#283B5826"
  shadowOpacity: 0.45
  shadowRadius: 2.2
  shadowOffset:
    x: 0
    "y": 1.5
