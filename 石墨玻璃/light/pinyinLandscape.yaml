# 石墨玻璃 — 浅色模式（冰晶石墨玻璃） — pinyinLandscape
preeditHeight: 24
toolbarHeight: 36
keyboardHeight: 164
transparentBackgroundStyle:
  buttonStyleType: geometry
  normalColor: "#E8EEF601"
  highlightColor: "#E8EEF601"
verticalCandidatesBackgroundStyle:
  buttonStyleType: geometry
  cornerRadius: 12
  normalColor: &id001
  - "#F3F7FCFA"
  - "#E6EEF8FC"
  highlightColor: *id001
  colorLocation:
  - 0
  - 1
  colorStartPoint:
