name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

# 皮肤目录名含中文，UTF-8 locale 下 zip 才会给文件名打 UTF-8 标记
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # 与本地 Homebrew 的 jsonnet v0.22.0 对齐；apt 源里的版本偏旧
      - name: Install jsonnet
        run: |
          go install github.com/google/go-jsonnet/cmd/jsonnet@v0.22.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install make & zip
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - name: Build skins
        run: |
          jsonnet --version
          make build
          ls -l build/

      # GitHub 会把 Release 附件名里的非 ASCII 字符替换掉，中文名的皮肤会撞名（already_exists），
      # 且应用依赖原文件名，所以打成一个 release.zip 发布。
      # .cskin 本身已是 zip，这里只存储不再压缩（ZIP_STORED）。
      # 用 Python zipfile 而非 zip 命令：它会给中文文件名打上 UTF-8 标记，解压方不会乱码
      - name: Package release.zip
        run: |
          python3 - <<'EOF'
          import pathlib, zipfile
          with zipfile.ZipFile("release.zip", "w", zipfile.ZIP_STORED) as z:
              for f in sorted(pathlib.Path("build").glob("*.cskin")):
                  z.write(f, f.name)
                  print(f.name)
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release.zip
