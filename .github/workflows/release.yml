name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

# 皮肤目录名含中文，UTF-8 locale 下 zip 才会给文件名打 UTF-8 标记
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 使用 deltarocks/jrsonnet（Rust 实现）替代 go-jsonnet 以加快编译速度
      - name: Install jrsonnet
        env:
          JRSONNET_VERSION: v0.5.0-pre98
          JRSONNET_SHA256: 63d4ca485c950a52164d7e2c55763af1a24416c38c2b708aa2bca27a1e17846a
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/jrsonnet" \
            "https://github.com/deltarocks/jrsonnet/releases/download/${JRSONNET_VERSION}/jrsonnet-x86_64-linux-musl"
          echo "${JRSONNET_SHA256}  $RUNNER_TEMP/bin/jrsonnet" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/jrsonnet"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install make & zip
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - name: Build skins
        run: |
          jrsonnet --version
          make build
          ls -l build/
          make solid
          ls -l build-solid/

      - name: Verify candidate filter panels in packaged layouts
        run: python3 tests/candidate_filter_panel_test.py

      # GitHub 会把 Release 附件名里的非 ASCII 字符替换掉，中文名的皮肤会撞名（already_exists），
      # 且应用依赖原文件名，所以打成 zip 发布：
      #   release.zip        渐变背景版（make build）
      #   release-solid.zip  纯色背景版（make solid）
      # .cskin 本身已是 zip，这里只存储不再压缩（ZIP_STORED）。
      # 用 Python zipfile 而非 zip 命令：它会给中文文件名打上 UTF-8 标记，解压方不会乱码
      - name: Package release zips
        run: |
          python3 - <<'EOF'
          import pathlib, zipfile
          for name, src in [("release.zip", "build"), ("release-solid.zip", "build-solid")]:
              print(f"== {name}")
              with zipfile.ZipFile(name, "w", zipfile.ZIP_STORED) as z:
                  for f in sorted(pathlib.Path(src).glob("*.cskin")):
                      z.write(f, f.name)
                      print(f.name)
          EOF

      # 重跑时 action-gh-release 会复用已有 Release 并保留旧附件，先删掉（不删 tag）保证只有本次的两个 zip
      - name: Remove existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes -R "${{ github.repository }}" || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release.zip
            release-solid.zip
